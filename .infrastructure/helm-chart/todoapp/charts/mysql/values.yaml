namespace:
  name: todoapp-ns

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

persistentVolumeClaim:
  storage: 2Gi
  accessModes:
    - ReadWriteOnce

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: app
          operator: In
          values:
          - mysql

tolerations:
- key: "app"
  operator: "Equal"
  value: "mysql"
  effect: "NoSchedule"

secrets:
  MYSQL_ROOT_PASSWORD: "rootpassword123"
  MYSQL_DATABASE: "todoapp"
  MYSQL_USER: "user"
  MYSQL_PASSWORD: "password"