namespace:
  name: todoapp-ns

serviceAccount:
  name: todoapp-sa

image:
  repository: nginx
  tag: "1.21"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

persistentVolume:
  capacity: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath: /data/todoapp

persistentVolumeClaim:
  storage: 1Gi
  accessModes:
    - ReadWriteOnce

nodeAffinity:
  key: "app"
  values:
    - "todoapp"

secrets:
  DATABASE_URL: "mysql://user:password@mysql:3306/todoapp"
  API_KEY: "secret-api-key-123"
  JWT_SECRET: "jwt-secret-token"